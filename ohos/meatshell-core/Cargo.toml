[package]
name = "meatshell-core"
version = "0.1.0"
edition = "2021"
description = "OpenHarmony port of the meatshell engine (SSH/SFTP/tunnel), including upstream sources verbatim via #[path]"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib"]

[features]
default = ["headless"]
headless = []

[dependencies]
# —— 与上游 0.8.1 根 Cargo.toml 同版本（只保留引擎闭包用到的）——
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
glob = "0.3"
encoding_rs = "0.8"
anyhow = "1"
thiserror = "1"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
# Pinned to 0.49：与上游一致（RUSTSEC-2026-0154 说明见上游 Cargo.toml）
russh = "0.49"
russh-keys = "0.49"
ssh-key = "0.6"
tracing = "0.1"
rand = "0.8"
async-trait = "0.1"
futures = "0.3"
vt100 = "0.16.2"
unicode-width = "0.2.1"
unicode-segmentation = "1.12"
russh-sftp = "2"
# Zeroes password buffers on drop (upstream: config)
zeroize = "1"
# SOCKS5 proxy tunnelling (upstream: ssh/impls/proxy)
tokio-socks = "0.5"
base64 = "0.22"
# PuTTY PPK v2/v3 私钥加载（upstream: ssh/impls/ppk）
aes = "0.8"
argon2 = "0.5"
cbc = "0.1"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
# OS locks serialize configuration writes (upstream: config)
fs2 = "0.4.3"
# FinalShell connection exports derive a DES key with MD5 (upstream: config/finalshell)
des = "0.8"
md5 = "0.7"
# ChaCha20-Poly1305 AEAD for encrypting passwords at rest (upstream: config)
chacha20poly1305 = "0.10"

# —— OHOS 交叉编译：链接器用 DevEco NDK 自带 ohos clang 包装器 ——
[target.x86_64-unknown-linux-ohos]
linker = "/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/x86_64-unknown-linux-ohos-clang"

[target.aarch64-unknown-linux-ohos]
linker = "/Applications/DevEco-Studio.app/Contents/sdk/default/openharmony/native/llvm/bin/aarch64-unknown-linux-ohos-clang"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
panic = "abort"
